ass="val" x="399.0" y="128.0" text-anchor="middle">21.0 s</text><text class="cat" x="198" y="189.0" text-anchor="end">Five files, --jobs 5</text><line class="conn" x1="291.9" y1="185.0" x2="352.2" y2="185.0"/><circle class="s1l ring" cx="352.2" cy="185.0" r="6"/><circle class="s1 ring" cx="291.9" cy="185.0" r="6"/><text class="val" x="352.2" y="174.0" text-anchor="middle">15.8 s</text><text class="val" x="291.9" y="174.0" text-anchor="middle">9.1 s</text><text class="cat" x="198" y="235.0" text-anchor="end">Five files, default arguments</text><line class="conn" x1="313.5" y1="231.0" x2="631.2" y2="231.0"/><circle class="s1l ring" cx="631.2" cy="231.0" r="6"/><circle class="s1 ring" cx="313.5" cy="231.0" r="6"/><text class="val" x="631.2" y="220.0" text-anchor="middle">46.8 s</text><text class="val" x="313.5" y="220.0" text-anchor="middle">11.5 s</text></svg>