<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Wall-clock time per workload, v0.1.0 versus v0.2.0, in seconds"><title>Wall-clock time per workload, v0.1.0 versus v0.2.0, in seconds</title>
<style>
  :root { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
          --s1:#2a78d6; --s1-light:#86b6ef; --s2:#eb6834; --s3:#1baf7a; --dim:#d6d5cf; }
  @media (prefers-color-scheme: dark) {
    :root { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
            --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --s3:#199e70; --dim:#3a3a38; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .surface { fill: var(--surface); }
  .title { font-size: 15px; font-weight: 600; }
  .sub, .legend { font-size: 12px; fill: var(--ink2); }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .cat { font-size: 12px; fill: var(--ink2); }
  .val { font-size: 12px; fill: var(--ink); font-variant-numeric: tabular-nums; }
  .val-in { font-size: 12px; fill: #ffffff; font-variant-numeric: tabular-nums; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .conn { stroke: var(--axis); stroke-width: 2; stroke-linecap: round; }
  .ring { stroke: var(--surface); stroke-width: 2; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); } .s3 { fill: var(--s3); } .dim { fill: var(--dim); }
</style>
