<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="Parquet encoding time of 12M rows under each writer setting"><title>Parquet encoding time of 12M rows under each writer setting</title>
<style>
